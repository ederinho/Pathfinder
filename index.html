<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinder</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141310"><link rel="icon" href="icon-192.png"><style> *{box-sizing:border-box}body{margin:0;background:#141310;color:#e5dcc9;font:16px system-ui}main{max-width:560px;margin:auto;padding:20px}h1,h2,h3{font-family:Georgia,serif;color:#cdb47c;font-weight:normal}header{text-align:center;border-bottom:1px solid #665638;padding:15px}h1{letter-spacing:5px;margin:8px}small,.muted{color:#b1a58f}section,article{background:#211e18;border:1px solid #514632;padding:15px;margin:12px 0;border-radius:5px}button,input,select{font:inherit;color:inherit;background:#302a20;border:1px solid #756344;border-radius:4px;padding:11px}button{cursor:pointer}button.primary{background:#c3a66b;color:#17130c;font-weight:bold}input,select{width:100%;margin:5px 0}nav{display:flex;gap:6px;position:sticky;top:0;background:#141310;padding:10px 0;z-index:2}nav button{flex:1;padding:10px 3px;font-size:14px}nav .active{border-color:#d5ba80;color:#e7c98a}progress{width:100%;height:9px;accent-color:#c3a66b} .row{display:flex;align-items:center;gap:10px;justify-content:space-between}.quest{display:flex;gap:10px;align-items:center}.quest input{width:24px;height:24px;accent-color:#c3a66b}.quest div{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#aaa08c}.gold{color:#d5ba80}label{display:block;margin-top:8px} .danger{color:#e2a398} .hidden{display:none}footer{text-align:center;margin:24px 0;font-size:12px;color:#aaa08c}.portrait{width:84px;height:84px;object-fit:cover;border:2px solid #b6a27a;border-radius:50%}.crest{font-size:48px;color:#cdb47c}.locked{opacity:.55}.talent{padding:8px 0;border-top:1px solid #514632}.stathead{display:flex;justify-content:space-between;gap:8px}.notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(90%,480px);background:#302a20;border:2px solid #cdb47c;padding:18px;z-index:10;text-align:center;box-shadow:0 4px 24px #000}.notice[hidden]{display:none}</style><main><header><div class="gold" style="font-size:32px">⚔</div><h1>PATHFINDER</h1><small>Każdy dzień jest kolejnym rozdziałem.</small></header><section id="hero"></section><nav><button data-tab="journal">Dziennik</button><button data-tab="character">Postać</button><button data-tab="history">Kronika</button></nav><div id="journal"><h2>Dziennik zadań</h2><div id="daily"></div><div id="quests"></div><section><h3>Nowe zadanie</h3><label>Gotowy szablon<select id="template"><option value="">Własne zadanie</option></select></label><form id="form"><label>Nazwa<input id="name" required maxlength="120" placeholder="Nazwa zadania"></label><label>Rodzaj<select id="type"><option value="side">Poboczne</option><option value="main">Główne</option><option value="daily">Codzienne</option><option value="contract">Kontrakt</option></select></label><label>Atrybut<select id="stat"></select></label><details><summary>Dodatkowe atrybuty (EXP dzielone)</summary><div id="extras"></div></details><label>Etapy (opcjonalnie, jeden w wierszu)<textarea id="steps" rows="3" style="width:100%;background:#302a20;color:inherit;font:inherit"></textarea></label><label>Trudność<select id="difficulty"><option value="10">Łatwe · 10 EXP</option><option value="25" selected>Średnie · 25 EXP</option><option value="50">Trudne · 50 EXP</option><option value="100">Epickie · 100 EXP</option></select></label><label>Doświadczenie (możesz zmienić)<input id="xp" type="number" min="1" max="1000" value="25" required></label><button id="submit" class="primary" style="width:100%;margin-top:12px">Dodaj zadanie</button><button id="cancel" type="button" hidden>Anuluj edycję</button></form></section></div><div id="character" class="hidden"><h2>Karta postaci</h2><section id="profile"></section><details><summary>Personalizacja postaci</summary><section><form id="profileForm"><label> function cleanProfile(p){return {name:typeof p?.name==='string'?p.name.slice(0,40):'',title:typeof p?.title==='string'?p.title.slice(0,60):'',portrait:typeof p?.portrait==='string'&&p.portrait.length<500000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.portrait)?p.portrait:''}}
try{let raw=localStorage.getItem(key);if(raw)data=normalize(JSON.parse(raw))}catch(e){alert('Nie udało się odczytać zapisu. Przywróć kopię.');}

function el(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function bar(x){let p=el('progress');p.max=100;p.value=x%100;return p}function completion(q){return data.log.find(l=>l.id===q.id&&(q.type!=='daily'||day(l.time)===day()))}function resetDaily(){let changed=false;for(let q of data.quests)if(q.type==='daily'&&q.stepDay!==day()){q.steps.forEach(s=>s.done=false);q.stepDay=day();changed=true}if(changed)save()}

function render(){resetDaily();let total=data.log.reduce((s,l)=>s+l.xp,0),today=data.log.filter(l=>day(l.time)===day()),level=1+Math.floor(total/100),rank=level<10?'Nowicjusz':level<20?'Adept':level<35?'Wędrowiec':level<50?'Weteran':level<75?'Mistrz':'Legenda';$('hero').replaceChildren(el('small',rank.toUpperCase()),el('h2','Poziom '+level),el('div',total%100+' / 100 EXP · Łącznie '+total+' EXP','gold'),bar(total));$('daily').replaceChildren(el('p',day()+' · Ukończono: '+today.length+' · +'+today.reduce((s,l)=>s+l.xp,0)+' EXP','muted'));$('quests').replaceChildren();for(let [type,title] of Object.entries(types)){let group=el('section');group.append(el('h3',title));let qs=data.quests.filter(q=>q.type===type);if(!qs.length)group.append(el('small','Brak zadań'));for(let q of qs){let done=completion(q),a=el('article'),r=el('div',undefined,'quest'),c=el('input');c.type='checkbox';c.checked=!!done;c.disabled=!done&&q.steps.some(s=>!s.done);c.onchange=()=>{if(completion(q)){data.log=data.log.filter(l=>l!==completion(q))}else{let before=progressSnapshot();data.log.push({id:q.id,name:q.name,stat:q.stat,extra:[...q.extra],xp:q.xp,time:Date.now()});announce(before)}save();render()};let d=el('div');d.append(el('strong',q.name,done?'done':''),el('p',[q.stat,...q.extra].map(i=>stats[i]).join(', ')+' · +'+q.xp+' EXP','muted'));r.append(c,d);a.append(r);for(let step of q.steps){let label=el('label'),ch=el('input');ch.type='checkbox';ch.style.width='auto';ch.checked=step.done;ch.disabled=!!done;ch.onchange=()=>{step.done=ch.checked;save();render()};label.append(ch,document.createTextNode(' '+step.name));a.append(label)}let buttons=el('div',undefined,'row'),edit=el('button','Edytuj'),del=el('button','Usuń','danger');edit.onclick=()=>editQuest(q);del.onclick=()=>{if(confirm('Usunąć zadanie? Zdobyte EXP pozostanie w kronice.')){data.quests=data.quests.filter(x=>x!==q);if(editing===q.id)clearForm();save();render()}};buttons.append(edit,del);a.append(buttons);group.append(a)}$('quests').append(group)}renderCharacter(total,level,rank);$('stats').replaceChildren();stats.forEach((s,i)=>{let x=data.log.reduce((a,l)=>a+allocation(l,i),0),a=el('section');a.append(el('div',icons[i]+' '+s+' · Poziom '+(1+Math.floor(x/100))),el('small',x%100+' / 100 EXP · Łącznie '+x),bar(x));for(let [lv,title] of talents[i].map((t,j)=>[[2,5,10][j],t])){let unlocked=1+Math.floor(x/100)>=lv;a.append(el('div',(unlocked?'✓ ':'🔒 ')+title+' · poziom '+lv,'talent '+(unlocked?'gold':'locked')))}$('stats').append(a)});$('log').replaceChildren();if(!data.log.length)$('log').append(el('p','Twoja kronika czeka na pierwszy wpis.','muted'));[...data.log].sort((a,b)=>b.time-a.time).forEach(l=>{let a=el('article');a.append(el('strong',l.name),el('p',day(l.time)+' · '+[l.stat,...l.extra].map(i=>stats[i]+' '+allocation(l,i)).join(', ')+' · +'+l.xp+' EXP','muted'));$('log').append(a)})}
function clearForm(){editing=null;$('form').reset();$('template').value='';$('submit').textContent='Dodaj zadanie';$('cancel').hidden=true;for(let c of $('extras').querySelectorAll('input'))c.checked=false}

stats.forEach((s,i)=>{ $('stat').add(new Option(s,i));let l=el('label'),c=el('input');c.type='checkbox';c.value=i;c.style.width='auto';l.append(c,document.createTextNode(' '+s));$('extras').append(l)});templates.forEach((t,i)=>$('template').add(new Option(t[0],i)));$('template').onchange=()=>{if($('template').value==='')return;let t=templates[+$('template').value];$('name').value=t[0];$('stat').value=t[1];$('difficulty').value=t[2];$('xp').value=t[2]};$('difficulty').onchange=()=>{$('xp').value=$('difficulty').value};$('cancel').onclick=clearForm;$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim();if(!n)return;let old=data.quests.find(q=>q.id===editing),stat=+$('stat').value,type=$('type').value;if(old&&old.type!==type&&data.log.some(l=>l.id===old.id)){alert('Nie można zmienić rodzaju zadania po zdobyciu EXP. Utwórz nowe zadanie.');return}let q={id:old?.id||Date.now().toString(36)+Math.random().toString(36).slice(2),name:n,stat,type,xp:+$('xp').value,extra:[...$('extras').querySelectorAll('input:checked')].map(c=>+c.value).filter(i=>i!==stat),steps:$('steps').value.split('\n').map(x=>x.trim()).filter(Boolean).map(name=>({name,done:old?.steps.some(s=>s.name===name&&s.done)||false})),stepDay:day()};if(old)data.quests[data.quests.indexOf(old)]=q;else data.quests.push(q);save();clearForm();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{['journal','character','history'].forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('nav button').classList.add('active');$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=el('a');a.href=u;a.download='pathfinder-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async()=>{try{let d=normalize(JSON.parse(await $('import').files[0].text()));if(confirm('Zastąpić obecny postę function progressSnapshot(){return {levels:[data.log.reduce((a,l)=>a+l.xp,0),...stats.map((_,i)=>data.log.reduce((a,l)=>a+allocation(l,i),0))].map(x=>1+Math.floor(x/100)),awards:awards.map(a=>a[2](data))}}
let noticeTimer;function announce(before){let after=progressSnapshot(),messages=[];after.levels.forEach((v,i)=>{if(v>before.levels[i])messages.push((i?stats[i-1]:'Awans postaci')+' — poziom '+v)});awards.forEach((a,i)=>{if(after.awards[i]&&!before.awards[i])messages.push('Osiągnięcie: '+a[0])});if(messages.length){$('notice').textContent=messages.join(' • ');$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,6500)}}
function renderCharacter(total,level,rank){let p=data.profile=cleanProfile(data.profile), portrait=p.portrait?el('img'):el('div','⚔','crest');if(p.portrait){portrait.src=p.portrait;portrait.alt='Portret postaci';portrait.className='portrait'}let r=el('div',undefined,'row'), info=el('div');info.append(el('h3',p.name||'Bezimienny wędrowiec'),el('div',p.title||rank,'gold'),el('small','Poziom '+level));r.append(portrait,info);$('profile').replaceChildren(r);let values=stats.map((_,i)=>data.log.reduce((a,l)=>a+allocation(l,i),0)),max=Math.max(...values);$('summary').replaceChildren(el('p','Ukończone zadania: '+data.log.length),el('p','Łączne EXP: '+total),el('p','Dni aktywności: '+new Set(data.log.map(l=>day(l.time))).size),el('p','Najsilniejszy atrybut: '+(max?stats.filter((_,i)=>values[i]===max).join(', '):'—')));$('achievements').replaceChildren();for(let a of awards){let ok=a[2](data),box=el('section',undefined,ok?'':'locked');box.append(el('strong',(ok?'🏆 ':'🔒 ')+a[0]),el('p',a[1],'muted'));$('achievements').append(box)}}
function fillProfile(){let p=cleanProfile(data.profile);$('heroName').value=p.name;$('heroTitle').value=p.title;$('portraitFile').value=''}
$('profileForm').onsubmit=async e=>{e.preventDefault();let p=cleanProfile(data.profile),f=$('portraitFile').files[0];try{if(f){if(f.size>15000000)throw Error();let url=URL.createObjectURL(f);try{let img=new Image();img.src=url;await img.decode();let c=document.createElement('canvas');c.width=c.height=256;let side=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,256,256);p.portrait=c.toDataURL('image/jpeg',.85)}finally{URL.revokeObjectURL(url)}}p.name=$('heroName').value.trim();p.title=$('heroTitle').value.trim();data.profile=p;save();fillProfile();render()}catch(e){alert('Nie udało się wczytać portretu. Wybierz mniejszy obraz.')}};$('removePortrait').onclick=()=>{data.profile=cleanProfile(data.profile);data.profile.portrait='';$('portraitFile').value='';save();render()};fillProfile();let lastDay=day();setInterval(()=>{if(day()!==lastDay){lastDay=day();render()}},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();
