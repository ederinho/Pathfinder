<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinder</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141310"><link rel="icon" href="icon-192.png"><style> *{box-sizing:border-box}body{margin:0;background:#141310;color:#e5dcc9;font:16px system-ui}main{max-width:560px;margin:auto;padding:20px}h1,h2,h3{font-family:Georgia,serif;color:#cdb47c;font-weight:normal}header{text-align:center;border-bottom:1px solid #665638;padding:15px}h1{letter-spacing:5px;margin:8px}small,.muted{color:#b1a58f}section,article{background:#211e18;border:1px solid #514632;padding:15px;margin:12px 0;border-radius:5px}button,input,select{font:inherit;color:inherit;background:#302a20;border:1px solid #756344;border-radius:4px;padding:11px}button{cursor:pointer}button.primary{background:#c3a66b;color:#17130c;font-weight:bold}input,select{width:100%;margin:5px 0}nav{display:flex;gap:6px;position:sticky;top:0;background:#141310;padding:10px 0;z-index:2}nav button{flex:1;padding:10px 3px;font-size:14px}nav .active{border-color:#d5ba80;color:#e7c98a}progress{width:100%;height:9px;accent-color:#c3a66b} .row{display:flex;align-items:center;gap:10px;justify-content:space-between}.quest{display:flex;gap:10px;align-items:center}.quest input{width:24px;height:24px;accent-color:#c3a66b}.quest div{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#aaa08c}.gold{color:#d5ba80}label{display:block;margin-top:8px} .danger{color:#e2a398} .hidden{display:none}footer{text-align:center;margin:24px 0;font-size:12px;color:#aaa08c}</style><main><header><div class="gold" style="font-size:32px">⚔</div><h1>PATHFINDER</h1><small>Każdy dzień jest kolejnym rozdziałem.</small></header><section id="hero"></section><nav><button data-tab="journal">Dziennik</button><button data-tab="character">Postać</button><button data-tab="history">Kronika</button></nav><div id="journal"><h2>Dziennik zadań</h2><div id="daily"></div><div id="quests"></div><section><h3>Nowe zadanie</h3><label>Gotowy szablon<select id="template"><option value="">Własne zadanie</option></select></label><form id="form"><label>Nazwa<input id="name" required maxlength="120" placeholder="Nazwa zadania"></label><label>Rodzaj<select id="type"><option value="side">Poboczne</option><option value="main">Główne</option><option value="daily">Codzienne</option><option value="contract">Kontrakt</option></select></label><label>Atrybut<select id="stat"></select></label><details><summary>Dodatkowe atrybuty (EXP dzielone)</summary><div id="extras"></div></details><label>Etapy (opcjonalnie, jeden w wierszu)<textarea id="steps" rows="3" style="width:100%;background:#302a20;color:inherit;font:inherit"></textarea></label><label>Trudność<select id="difficulty"><option value="10">Łatwe · 10 EXP</option><option value="25" selected>Średnie · 25 EXP</option><option value="50">Trudne · 50 EXP</option><option value="100">Epickie · 100 EXP</option></select></label><label>Doświadczenie (możesz zmienić)<input id="xp" type="number" min="1" max="1000" value="25" required></label><button id="submit" class="primary" style="width:100%;margin-top:12px">Dodaj zadanie</button><button id="cancel" type="button" hidden>Anuluj edycję</button></form></section></div><div id="character" class="hidden"><h2>Atrybuty postaci</h2><div id="stats"></div></div><div id="history" class="hidden"><h2>Kronika</h2><div id="log"></div><section><h3>Kopia zapasowa</h3><button id="export">Eksportuj postęp</button><label>Przywróć kopię<input id="import" type="file" accept="application/json,.json"></label></section></div><footer>PATHFINDER · v0.3 · Dane lokalne</footer></main><script>
const $=id=>document.getElementById(id), stats=['Siła','Wytrzymałość','Wiedza','Dyscyplina','Sport','Organizacja','Relacje','Komunikacja','Zdrowie psychiczne','Gotowanie','Adaptacja','Szczęście'], templates=[['Powtórka japońskiego – 30 min',2,25],['Obejrzenie wykładu',2,25],['Trening fizyczny',1,25],['Porządek w kwaterze',5,10],['Praca nad projektem',3,50],['Spacer',1,10],['Przygotowanie posiłku',9,25]];
const key='pathfinder-v01', types={main:'Zadania główne',side:'Zadania poboczne',daily:'Zadania codzienne',contract:'Kontrakty'}; let data={quests:[],log:[]}, editing=null;
function day(t=Date.now()){return new Date(t).toLocaleDateString('pl-PL')}
function normalize(d){if(!Array.isArray(d.quests))throw Error('quests');let ids=new Set();for(let q of d.quests){if(typeof q.id!=='string'||ids.has(q.id)||typeof q.name!=='string'||!Number.isInteger(q.stat)||q.stat<0||q.stat>=stats.length||!Number.isInteger(q.xp)||q.xp<1||q.xp>1000)throw Error('quest');ids.add(q.id);q.type=Object.hasOwn(types,q.type)?q.type:'side';q.steps=Array.isArray(q.steps)?q.steps.map(x=>({name:String(x.name),done:!!x.done})):[];q.extra=Array.isArray(q.extra)?[...new Set(q.extra.filter(i=>Number.isInteger(i)&&i>=0&&i<stats.length&&i!==q.stat))]:[];q.stepDay=q.stepDay||day();}if(!Array.isArray(d.log))d.log=d.quests.filter(q=>Number.isFinite(q.done)).map(q=>({id:q.id,name:q.name,stat:q.stat,extra:[],xp:q.xp,time:q.done}));for(let l of d.log){if(typeof l.id!=='string'||typeof l.name!=='string'||!Number.isInteger(l.stat)||l.stat<0||l.stat>=stats.length||!Number.isInteger(l.xp)||l.xp<1||l.xp>1000||!Number.isFinite(l.time))throw Error('log');l.extra=Array.isArray(l.extra)?[...new Set(l.extra.filter(i=>Number.isInteger(i)&&i>=0&&i<stats.length&&i!==l.stat))]:[];}return d}
try{let raw=localStorage.getItem(key);if(raw)data=normalize(JSON.parse(raw))}catch(e){alert('Nie udało się odczytać zapisu. Przywróć kopię.');}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Zapis lokalny niedostępny. Wyeksportuj kopię.')}}
function el(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function bar(x){let p=el('progress');p.max=100;p.value=x%100;return p}function completion(q){return data.log.find(l=>l.id===q.id&&(q.type!=='daily'||day(l.time)===day()))}function resetDaily(){let changed=false;for(let q of data.quests)if(q.type==='daily'&&q.stepDay!==day()){q.steps.forEach(s=>s.done=false);q.stepDay=day();changed=true}if(changed)save()}
function allocation(l,i){let a=[l.stat,...l.extra],k=a.indexOf(i);return k<0?0:Math.floor(l.xp/a.length)+(k<l.xp%a.length?1:0)}
function render(){resetDaily();let total=data.log.reduce((s,l)=>s+l.xp,0),today=data.log.filter(l=>day(l.time)===day()),level=1+Math.floor(total/100),rank=level<10?'Nowicjusz':level<20?'Adept':level<35?'Wędrowiec':level<50?'Weteran':level<75?'Mistrz':'Legenda';$('hero').replaceChildren(el('small',rank.toUpperCase()),el('h2','Poziom '+level),el('div',total%100+' / 100 EXP · Łącznie '+total+' EXP','gold'),bar(total));$('daily').replaceChildren(el('p',day()+' · Ukończono: '+today.length+' · +'+today.reduce((s,l)=>s+l.xp,0)+' EXP','muted'));$('quests').replaceChildren();for(let [type,title] of Object.entries(types)){let group=el('section');group.append(el('h3',title));let qs=data.quests.filter(q=>q.type===type);if(!qs.length)group.append(el('small','Brak zadań'));for(let q of qs){let done=completion(q),a=el('article'),r=el('div',undefined,'quest'),c=el('input');c.type='checkbox';c.checked=!!done;c.disabled=!done&&q.steps.some(s=>!s.done);c.onchange=()=>{if(completion(q)){data.log=data.log.filter(l=>l!==completion(q))}else{data.log.push({id:q.id,name:q.name,stat:q.stat,extra:[...q.extra],xp:q.xp,time:Date.now()})}save();render()};let d=el('div');d.append(el('strong',q.name,done?'done':''),el('p',[q.stat,...q.extra].map(i=>stats[i]).join(', ')+' · +'+q.xp+' EXP','muted'));r.append(c,d);a.append(r);for(let step of q.steps){let label=el('label'),ch=el('input');ch.type='checkbox';ch.style.width='auto';ch.checked=step.done;ch.disabled=!!done;ch.onchange=()=>{step.done=ch.checked;save();render()};label.append(ch,document.createTextNode(' '+step.name));a.append(label)}let buttons=el('div',undefined,'row'),edit=el('button','Edytuj'),del=el('button','Usuń','danger');edit.onclick=()=>editQuest(q);del.onclick=()=>{if(confirm('Usunąć zadanie? Zdobyte EXP pozostanie w kronice.')){data.quests=data.quests.filter(x=>x!==q);if(editing===q.id)clearForm();save();render()}};buttons.append(edit,del);a.append(buttons);group.append(a)}$('quests').append(group)}$('stats').replaceChildren();stats.forEach((s,i)=>{let x=data.log.reduce((a,l)=>a+allocation(l,i),0),a=el('section');a.append(el('div',s+' · Poziom '+(1+Math.floor(x/100))),el('small',x%100+' / 100 EXP'),bar(x));$('stats').append(a)});$('log').replaceChildren();if(!data.log.length)$('log').append(el('p','Twoja kronika czeka na pierwszy wpis.','muted'));[...data.log].sort((a,b)=>b.time-a.time).forEach(l=>{let a=el('article');a.append(el('strong',l.name),el('p',day(l.time)+' · '+[l.stat,...l.extra].map(i=>stats[i]+' '+allocation(l,i)).join(', ')+' · +'+l.xp+' EXP','muted'));$('log').append(a)})}
function clearForm(){editing=null;$('form').reset();$('template').value='';$('submit').textContent='Dodaj zadanie';$('cancel').hidden=true;for(let c of $('extras').querySelectorAll('input'))c.checked=false}
function editQuest(q){editing=q.id;$('name').value=q.name;$('stat').value=q.stat;$('type').value=q.type;$('xp').value=q.xp;$('steps').value=q.steps.map(s=>s.name).join('\n');for(let c of $('extras').querySelectorAll('input'))c.checked=q.extra.includes(+c.value);$('submit').textContent='Zapisz zmiany';$('cancel').hidden=false;$('form').scrollIntoView({behavior:'smooth'})}
stats.forEach((s,i)=>{ $('stat').add(new Option(s,i));let l=el('label'),c=el('input');c.type='checkbox';c.value=i;c.style.width='auto';l.append(c,document.createTextNode(' '+s));$('extras').append(l)});templates.forEach((t,i)=>$('template').add(new Option(t[0],i)));$('template').onchange=()=>{if($('template').value==='')return;let t=templates[+$('template').value];$('name').value=t[0];$('stat').value=t[1];$('difficulty').value=t[2];$('xp').value=t[2]};$('difficulty').onchange=()=>{$('xp').value=$('difficulty').value};$('cancel').onclick=clearForm;$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim();if(!n)return;let old=data.quests.find(q=>q.id===editing),stat=+$('stat').value,type=$('type').value;if(old&&old.type!==type&&data.log.some(l=>l.id===old.id)){alert('Nie można zmienić rodzaju zadania po zdobyciu EXP. Utwórz nowe zadanie.');return}let q={id:old?.id||Date.now().toString(36)+Math.random().toString(36).slice(2),name:n,stat,type,xp:+$('xp').value,extra:[...$('extras').querySelectorAll('input:checked')].map(c=>+c.value).filter(i=>i!==stat),steps:$('steps').value.split('\n').map(x=>x.trim()).filter(Boolean).map(name=>({name,done:old?.steps.some(s=>s.name===name&&s.done)||false})),stepDay:day()};if(old)data.quests[data.quests.indexOf(old)]=q;else data.quests.push(q);save();clearForm();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{['journal','character','history'].forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('nav button').classList.add('active');$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=el('a');a.href=u;a.download='pathfinder-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async()=>{try{let d=normalize(JSON.parse(await $('import').files[0].text()));if(confirm('Zastąpić obecny postęp kopią?')){data=d;save();clearForm();render()}}catch(e){alert('Nieprawidłowy plik kopii.')}finally{$('import').value=''}};let lastDay=day();setInterval(()=>{if(day()!==lastDay){lastDay=day();render()}},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();
</script></html>
