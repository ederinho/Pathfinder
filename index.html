<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinder</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141310"><link rel="icon" href="icon-192.png"><style> *{box-sizing:border-box}body{margin:0;background:#141310;color:#e5dcc9;font:16px system-ui}main{max-width:560px;margin:auto;padding:20px}h1,h2,h3{font-family:Georgia,serif;color:#cdb47c;font-weight:normal}header{text-align:center;border-bottom:1px solid #665638;padding:15px}h1{letter-spacing:5px;margin:8px}small,.muted{color:#b1a58f}section,article{background:#211e18;border:1px solid #514632;padding:15px;margin:12px 0;border-radius:5px}button,input,select{font:inherit;color:inherit;background:#302a20;border:1px solid #756344;border-radius:4px;padding:11px}button{cursor:pointer}button.primary{background:#c3a66b;color:#17130c;font-weight:bold}input,select{width:100%;margin:5px 0}nav{display:flex;gap:6px;position:sticky;top:0;background:#141310;padding:10px 0;z-index:2}nav button{flex:1;padding:10px 3px;font-size:14px}nav .active{border-color:#d5ba80;color:#e7c98a}progress{width:100%;height:9px;accent-color:#c3a66b} .row{display:flex;align-items:center;gap:10px;justify-content:space-between}.quest{display:flex;gap:10px;align-items:center}.quest input{width:24px;height:24px;accent-color:#c3a66b}.quest div{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#aaa08c}.gold{color:#d5ba80}label{display:block;margin-top:8px} .danger{color:#e2a398} .hidden{display:none}footer{text-align:center;margin:24px 0;font-size:12px;color:#aaa08c}</style><main><header><div class="gold" style="font-size:32px">⚔</div><h1>PATHFINDER</h1><small>Każdy dzień jest kolejnym rozdziałem.</small></header><section id="hero"></section><nav><button data-tab="journal">Dziennik</button><button data-tab="character">Postać</button><button data-tab="history">Kronika</button></nav><div id="journal"><h2>Dziennik zadań</h2><div id="daily"></div><div id="quests"></div><section><h3>Nowe zadanie</h3><label>Gotowy szablon<select id="template"><option value="">Własne zadanie</option></select></label><form id="form"><label>Nazwa<input id="name" required maxlength="120" placeholder="Nazwa zadania"></label><label>Atrybut<select id="stat"></select></label><label>Trudność<select id="difficulty"><option value="10">Łatwe · 10 EXP</option><option value="25" selected>Średnie · 25 EXP</option><option value="50">Trudne · 50 EXP</option><option value="100">Epickie · 100 EXP</option></select></label><label>Doświadczenie (możesz zmienić)<input id="xp" type="number" min="1" max="1000" value="25" required></label><button class="primary" style="width:100%;margin-top:12px">Dodaj zadanie</button></form></section></div><div id="character" class="hidden"><h2>Atrybuty postaci</h2><div id="stats"></div></div><div id="history" class="hidden"><h2>Kronika</h2><div id="log"></div><section><h3>Kopia zapasowa</h3><button id="export">Eksportuj postęp</button><label>Przywróć kopię<input id="import" type="file" accept="application/json,.json"></label></section></div><footer>PATHFINDER · v0.1 · Dane lokalne</footer></main><script>
const $=id=>document.getElementById(id), stats=['Siła','Wytrzymałość','Wiedza','Dyscyplina','Sport','Organizacja','Relacje','Komunikacja','Zdrowie psychiczne','Gotowanie','Adaptacja','Szczęście'], templates=[['Powtórka japońskiego – 30 min',2,25],['Obejrzenie wykładu',2,25],['Trening fizyczny',1,25],['Porządek w kwaterze',5,10],['Praca nad projektem',3,50],['Spacer',1,10],['Przygotowanie posiłku',9,25]];const key='pathfinder-v01';let data={quests:[]};try{const raw=localStorage.getItem(key);if(raw)data=JSON.parse(raw)}catch(e){alert('Nie udało się odczytać zapisu.')}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Zapis lokalny niedostępny. Wyeksportuj kopię w Kronice.')}}function day(t=Date.now()){return new Date(t).toLocaleDateString('pl-PL')}function el(tag,txt,cls){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function bar(x){let p=el('progress');p.max=100;p.value=x%100;return p}function render(){let completed=data.quests.filter(q=>q.done),total=completed.reduce((s,q)=>s+q.xp,0),today=completed.filter(q=>day(q.done)===day());$('hero').replaceChildren(el('small','ŚCIEŻKA ADEPTA'),el('h2','Poziom '+(1+Math.floor(total/100))),el('div',total%100+' / 100 EXP · Łącznie '+total+' EXP','gold'),bar(total));$('daily').replaceChildren(el('p',day()+' · Ukończono: '+today.length+' · +'+today.reduce((s,q)=>s+q.xp,0)+' EXP','muted'));$('quests').replaceChildren();let visible=data.quests.filter(q=>!q.done||day(q.done)===day());if(!visible.length)$('quests').append(el('p','Dziennik jest pusty. Dodaj pierwsze zadanie.','muted'));visible.forEach(q=>{let a=el('article',undefined,'quest'),c=el('input');c.type='checkbox';c.checked=!!q.done;c.setAttribute('aria-label','Ukończ '+q.name);c.onchange=()=>{q.done=c.checked?Date.now():null;save();render()};let d=el('div');d.append(el('strong',q.name,q.done?'done':''),el('p',stats[q.stat]+' · +'+q.xp+' EXP','muted'));let b=el('button','×','danger');b.setAttribute('aria-label','Usuń zadanie');b.onclick=()=>{if(confirm('Usunąć zadanie wraz z jego EXP?')){data.quests=data.quests.filter(x=>x.id!==q.id);save();render()}};a.append(c,d,b);$('quests').append(a)});$('stats').replaceChildren();stats.forEach((s,i)=>{let x=completed.filter(q=>q.stat===i).reduce((a,q)=>a+q.xp,0),a=el('section');a.append(el('div',s+' · Poziom '+(1+Math.floor(x/100))),el('small',x%100+' / 100 EXP'),bar(x));$('stats').append(a)});$('log').replaceChildren();if(!completed.length)$('log').append(el('p','Twoja kronika czeka na pierwszy wpis.','muted'));completed.sort((a,b)=>b.done-a.done).forEach(q=>{let a=el('article');a.append(el('strong',q.name),el('p',day(q.done)+' · '+stats[q.stat]+' · +'+q.xp+' EXP','muted'));$('log').append(a)})}stats.forEach((s,i)=>$('stat').add(new Option(s,i)));templates.forEach((t,i)=>$('template').add(new Option(t[0],i)));$('template').onchange=()=>{if($('template').value==='')return;let t=templates[+$('template').value];$('name').value=t[0];$('stat').value=t[1];$('difficulty').value=t[2];$('xp').value=t[2]};$('difficulty').onchange=()=>{$('xp').value=$('difficulty').value};$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim();if(!n)return;data.quests.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:n,stat:+$('stat').value,xp:+$('xp').value,done:null});save();$('name').value='';$('template').value='';render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{['journal','character','history'].forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('nav button').classList.add('active');$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=el('a');a.href=u;a.download='pathfinder-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async()=>{try{let d=JSON.parse(await $('import').files[0].text());if(!Array.isArray(d.quests)||!d.quests.every(q=>typeof q.id==='string'&&typeof q.name==='string'&&Number.isInteger(q.stat)&&q.stat>=0&&q.stat<stats.length&&Number.isInteger(q.xp)&&q.xp>=1&&q.xp<=1000&&(q.done===null||Number.isFinite(q.done)))||new Set(d.quests.map(q=>q.id)).size!==d.quests.length)throw Error();if(confirm('Zastąpić obecny postęp kopią?')){data=d;save();render()}}catch(e){alert('Nieprawidłowy plik kopii.')}};render();</script></html>
